apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
      - name: website
        image: us-central1-docker.pkg.dev/pk-sandbox-507311/pk-repo-v2/pk-website:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        volumeMounts:
        - name: website-storage
          mountPath: /usr/share/nginx/html/data
      volumes:
      - name: website-storage
        persistentVolumeClaim:
          claimName: website-pvc  # <--- Industry Standard!
