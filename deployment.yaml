apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
      annotations:
        rollout: "update-1" 
    spec:
      containers:
      - name: website
        image: us-central1-docker.pkg.dev/pk-sandbox-507311/pk-repo-v2/pk-website:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: website-storage
          mountPath: /usr/share/nginx/html/data
      volumes:
      - name: website-storage
        gcePersistentDisk:
          pdName: pk-persistent-disk-v2
          fsType: ext4
